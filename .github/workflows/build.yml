name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd FundApp && xcodegen generate
      - name: Build unsigned archive
        run: |
          cd FundApp
          xcodebuild archive \
            -scheme FundApp \
            -configuration Release \
            -archivePath build/FundApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO
      - name: Export IPA
        run: |
          cd FundApp
          mkdir -p build/Payload
          cp -r build/FundApp.xcarchive/Products/Applications/FundApp.app build/Payload/
          cd build
          zip -r FundApp.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FundApp-IPA
          path: FundApp/build/FundApp.ipa
